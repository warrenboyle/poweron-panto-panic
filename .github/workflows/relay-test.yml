name: Relay test (temporary)
on:
  workflow_dispatch:
    inputs:
      hop:
        default: "1"
permissions:
  actions: write
jobs:
  hop:
    runs-on: ubuntu-latest
    steps:
      - run: echo "hop ${{ inputs.hop }}"
      - if: inputs.hop == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run relay-test.yml --repo "$GITHUB_REPOSITORY" --ref main -f hop=2
